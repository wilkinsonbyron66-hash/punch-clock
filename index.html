<style>
/* Layout: a B3-branded time-clock terminal. An aubergine clock-face panel anchors every view; light time-cards and charts sit below it. */
:root{
  --bg:#EFECF4; --surface:#FFFFFF; --surface-2:#F6F3F9; --line:#E2DCEA; --line-2:#CFC6DB;
  --ink:#1C1326; --muted:#62576F; --faint:#958AA3;
  --accent:#5B2A86; --accent-ink:#FFFFFF; --accent-soft:#EEE5F6;
  --brand:#4B2163; --brand-text:#3A3A3F;
  --hero:#2C1240; --hero-2:#3C1C55; --hero-fg:#FBF7FF; --hero-muted:#C7B3D8; --hero-line:#55306F;
  --in:#11885A; --in-soft:#DAF2E6; --late:#C26A00; --late-soft:#FCEBD2;
  --done:#5E566B; --done-soft:#EAE6EF; --leave:#C2386F; --leave-soft:#FBE3EC; --absent:#D3CCDC;
  --home:#0B7F8C; --home-soft:#D8F1F3;
  --danger:#C93030;
  --shadow:0 1px 2px rgba(44,18,64,.05),0 6px 20px rgba(44,18,64,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120C19; --surface:#1B1426; --surface-2:#221A30; --line:#30263F; --line-2:#433654;
  --ink:#F1ECF7; --muted:#ACA0BC; --faint:#776C88;
  --accent:#B58CE6; --accent-ink:#1A0D27; --accent-soft:#2F2045;
  --brand:#C9A6EE; --brand-text:#D9D3E2;
  --hero:#2A1140; --hero-2:#3A1B57; --hero-fg:#FBF7FF; --hero-muted:#C2ADD6; --hero-line:#563275;
  --in:#45D196; --in-soft:#11352A; --late:#F4A945; --late-soft:#3A2911;
  --done:#B3A9C2; --done-soft:#2A2238; --leave:#F27AA8; --leave-soft:#3E1A2A; --absent:#3A304A;
  --home:#3FC8D4; --home-soft:#0F3338;
  --danger:#FF7B7B; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#120C19; --surface:#1B1426; --surface-2:#221A30; --line:#30263F; --line-2:#433654;
  --ink:#F1ECF7; --muted:#ACA0BC; --faint:#776C88;
  --accent:#B58CE6; --accent-ink:#1A0D27; --accent-soft:#2F2045;
  --brand:#C9A6EE; --brand-text:#D9D3E2;
  --hero:#2A1140; --hero-2:#3A1B57; --hero-fg:#FBF7FF; --hero-muted:#C2ADD6; --hero-line:#563275;
  --in:#45D196; --in-soft:#11352A; --late:#F4A945; --late-soft:#3A2911;
  --done:#B3A9C2; --done-soft:#2A2238; --leave:#F27AA8; --leave-soft:#3E1A2A; --absent:#3A304A;
  --home:#3FC8D4; --home-soft:#0F3338;
  --danger:#FF7B7B; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent) 60%,transparent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:46px;width:auto;flex:none;display:block}
.divider{width:1px;height:34px;background:var(--line-2);flex:none}
.watermark{position:absolute;right:-18px;bottom:-36px;height:260px;width:auto;fill:var(--hero-fg);opacity:.06;pointer-events:none;transform:rotate(-4deg)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.015em;margin:0;white-space:nowrap;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected="true"]{background:var(--hero);color:var(--hero-fg)}

main{padding-block:20px 72px}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;font-weight:500}

/* clock face hero */
.face{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:22px 24px 20px;margin-bottom:20px;position:relative;overflow:hidden}
.face{background:radial-gradient(120% 140% at 100% 0%,var(--hero-2) 0%,var(--hero) 60%)}
.face-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px 28px;position:relative;z-index:1}
.face .eyebrow{color:var(--hero-muted)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(46px,11vw,84px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:8px}
.clock .sec{color:var(--hero-muted);font-size:.42em;margin-left:6px;letter-spacing:0}
.tally{display:grid;grid-template-columns:repeat(5,minmax(58px,1fr));gap:4px;flex:1 1 420px;max-width:620px;background:var(--hero-line);border-radius:14px;overflow:hidden;padding:1px}
.tally div{background:var(--hero-2);padding:12px 12px;min-width:0}
@media (max-width:480px){.tally{grid-template-columns:repeat(6,minmax(0,1fr))}.tally div{grid-column:span 2}.tally div:nth-child(-n+2){grid-column:span 3}
  .tabs{width:100%}.tabs button{flex:1;justify-content:center;padding:8px 6px;font-size:13px}.tabs button svg{display:none}}
.toast[hidden],.tip[hidden]{display:none}
.dateclock{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:clamp(40px,8vw,64px)}
.dateclock .sec{display:block;font-family:var(--f-body);font-weight:700;font-size:.36em;letter-spacing:0;margin:6px 0 0;color:var(--hero-muted)}
.tally.t4{grid-template-columns:repeat(4,minmax(64px,1fr))}
@media (max-width:480px){.tally.t4{grid-template-columns:repeat(2,minmax(0,1fr))}.tally.t4 div{grid-column:auto!important}}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hbars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.hb{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.hb-t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}.hb-t i{display:block;height:100%;border-radius:99px}
.hb b{font-family:var(--f-mono);color:var(--ink);text-align:right}
.wk td.cell.office span{background:var(--in-soft);color:var(--in);font-family:var(--f-body);font-weight:700}
.wk td.cell.home span{font-family:var(--f-body);font-weight:700}
/* today: bulk bar + inline edit */
.bulk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.bulk b{display:block;font-weight:800}.bulk span{color:var(--muted);font-size:13.5px}
.editbox{display:flex;flex-direction:column;gap:10px;width:100%}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit-row .inp{padding:8px 10px}
.editbox .seg{align-self:flex-start}
textarea.inp{resize:vertical;min-height:58px;font:inherit;line-height:1.4}
.inp.ro{background:transparent;border-style:dashed;color:var(--muted);font-family:var(--f-mono);font-size:13.5px}
.note{display:flex;gap:8px;align-items:flex-start;margin:-4px 0 0;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.links{display:flex;gap:14px;flex-wrap:wrap}
.adminbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:11px;padding:8px 13px;font-weight:800;font-size:13.5px;white-space:nowrap}
.adminbtn svg{width:16px;height:16px}
.adminbtn[aria-pressed="true"]{background:var(--in-soft);border-color:transparent;color:var(--in)}
.adminbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--in)}
.pinbox{width:min(360px,100%)}
body.viewer .card .acts,body.viewer .card .links,body.viewer .card>.link,body.viewer .pen,body.viewer .bulk{display:none!important}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stbtn{border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-weight:800;font-size:12.5px;background:var(--surface-2);color:var(--ink)}
.stbtn.st-in{--lv:var(--in);--lvs:var(--in-soft)} .stbtn.st-home{--lv:var(--home);--lvs:var(--home-soft)} .stbtn.st-none{--lv:var(--muted);--lvs:var(--surface-2)}
.stbtn[aria-pressed="true"]{background:var(--lvs,var(--accent-soft));color:var(--lv,var(--accent));border-color:var(--lv,var(--accent));box-shadow:0 0 0 2px var(--lvs,var(--accent-soft))}
.btn svg{flex:none}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.daypick{display:flex;align-items:center;gap:10px}
.daypick .inp{width:auto;padding:8px 10px;font-family:var(--f-mono);font-weight:600;background:var(--surface-2)}
.daynote{font-size:13px;font-weight:700;color:var(--muted)}
.daynote.warn{color:var(--late)}
.who{position:relative}
.who>div:nth-child(2){flex:1}
.pen{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--faint);display:grid;place-items:center;align-self:flex-start}
.pen svg{width:16px;height:16px}
.card:hover .pen,.pen:focus-visible{color:var(--accent);border-color:var(--line);background:var(--surface-2)}
@media (hover:none){.pen{color:var(--muted)}}
.rename{display:flex;flex-direction:column;gap:8px}
.rename .inp{padding:9px 11px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.emo{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.emo.ini{font-size:12px;font-weight:800;color:var(--muted)}
.emo.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.hint{font-size:11.5px;color:var(--muted)}
.av .ae{font-size:1.55em;line-height:1}
.av{font-family:var(--f-body),"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.exp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.reports{grid-template-columns:1fr}}
.rep{display:flex;flex-direction:column;gap:14px}
.rep h3{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0}
.rep .sub{margin:2px 0 0}
.rep-h{display:flex;gap:12px;align-items:flex-start}
.ricon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ricon svg{width:22px;height:22px}
.rep-c{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.rep-c .sel{font-family:var(--f-mono)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini-t{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--muted);border-left:3px solid var(--c)}
.mini-t b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);line-height:1.1}
.mailbox{grid-column:1/-1}
.btn.pdfbtn{background:var(--hero);color:var(--hero-fg)}
.pdfov{position:fixed;inset:0;z-index:40;background:rgba(18,10,26,.62);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pdfbox{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pdfbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdfbar b{display:block;font-weight:800}.pdfbar span{font-size:12.5px;color:var(--muted)}
.pdfimg{overflow:auto;padding:14px;background:var(--surface-2)}
.pdfimg img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff}
.mailtxt{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:220px;background:var(--surface-2)}
.inp.sel{width:auto;padding:8px 10px;font-size:13px;font-weight:700;background:var(--surface)}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.lvbtn{border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--ink)}
.lv-ooo{--lv:#8A6400;--lvs:#FFF1BF} .lv-annual{--lv:#1F5A96;--lvs:#DCEAFA} .lv-sick{--lv:#B0304F;--lvs:#FBDDE4} .lv-half{--lv:#A4520A;--lvs:#FDDCBC} .lv-emergency{--lv:#A3261B;--lvs:#FCDCD6} .lv-other{--lv:#4F4760;--lvs:#E9E5EF}
.lvbtn.lv-ooo,.lvbtn.lv-annual,.lvbtn.lv-sick,.lvbtn.lv-half,.lvbtn.lv-emergency,.lvbtn.lv-other{background:var(--lvs);color:var(--lv);border-color:transparent}
.pill.leave.lv-ooo,.pill.leave.lv-annual,.pill.leave.lv-sick,.pill.leave.lv-half,.pill.leave.lv-emergency,.pill.leave.lv-other,.wk td.cell.leave span[class^="lv-"]{background:var(--lvs);color:var(--lv)}
.wk td.cell span{position:relative}
.ndot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
/* schedule */
.sched{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
@media (max-width:900px){.sched{grid-template-columns:1fr}}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:10px 0;border-top:1px solid var(--line);min-height:58px}
@media (max-width:520px){.hrow{flex-wrap:wrap}.hrow em{margin-left:auto}}
.hrow b{width:104px;flex:none;font-weight:800}
.hrow b small{display:inline-block;font-size:10.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 7px;margin-left:4px;letter-spacing:.04em;text-transform:uppercase}
.hrow.off b{color:var(--muted)}
.hspan{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0}
.hspan .inp{flex:1 1 0;min-width:0;max-width:150px;padding:8px 8px;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.hspan>span{color:var(--muted);font-size:13px}
.offtxt{color:var(--faint);font-size:13.5px;font-weight:600}
.hrow em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:56px;text-align:right;flex:none}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.weekly{text-align:right}.weekly b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800}
table.wg{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.wg th,.wg td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.wg th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.wg th.today{color:var(--accent)} .wg th.offc{color:var(--faint)}
.wg td.nm,.wg th:first-child,.wg tfoot td:first-child{text-align:left}
.wg .person{display:flex;align-items:center;gap:9px;font-weight:700}
.wg .person .av{width:28px;height:28px;font-size:11px;box-shadow:none}
.wg tfoot td{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);border-bottom:0;padding-top:9px}
.wg tfoot td:first-child{font-family:var(--f-body);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wbtn{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--faint);display:inline-grid;place-items:center}
.wbtn svg{width:17px;height:17px}
.wbtn[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
.wbtn.offday{opacity:.45}
.tally b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--hero-muted);font-weight:700;display:flex;align-items:center;gap:6px}
.tally i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* day track */
.track{position:relative;z-index:1;margin-top:20px}
.track-bar{position:relative;height:10px;border-radius:99px;background:var(--hero-line)}
.track-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--hero-2),var(--accent))}
.track-start{position:absolute;top:-5px;width:2px;height:20px;background:var(--hero-fg);border-radius:2px}
.track-now{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--hero-fg);border:3px solid var(--accent);transform:translate(-50%,-50%)}
.track-labels{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--hero-muted)}
.track-note{color:var(--hero-muted);font-size:13px;font-weight:600}

.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--hero);color:var(--hero-fg);border-color:var(--hero)}

/* person cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);transition:border-color .2s}
.card.s-in{border-color:color-mix(in srgb,var(--in) 35%,var(--line))}
.card.s-late{border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.card.s-in.at-home{border-color:color-mix(in srgb,var(--home) 40%,var(--line))}
.s-in.at-home .av{--ring:var(--home)}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:-4px}
.btn.home{background:var(--home);color:#fff}
.btn.home-ghost{background:var(--home-soft);color:var(--home);border:1px solid color-mix(in srgb,var(--home) 30%,transparent)}
.pill.home{background:var(--home-soft);color:var(--home)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 0;width:38px;font-size:12px;font-weight:800}
.days button[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
.days button[disabled]{cursor:default;opacity:.6}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff;position:relative;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ring,transparent)}
.s-in .av{--ring:var(--in)} .s-late .av{--ring:var(--late)} .s-done .av{--ring:var(--done)} .s-leave .av{--ring:var(--leave)}
.who div{min-width:0}
.who strong{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--muted);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-height:28px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.in{background:var(--in-soft);color:var(--in)} .pill.late{background:var(--late-soft);color:var(--late)}
.pill.done{background:var(--done-soft);color:var(--done)} .pill.leave{background:var(--leave-soft);color:var(--leave)}
.times{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.times em{font-style:normal;color:var(--muted);font-weight:500}
.acts{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:14.5px;background:var(--accent);color:var(--accent-ink);transition:transform .08s ease,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.07)}
.btn.out{background:var(--hero);color:var(--hero-fg)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.btn.sm{flex:none;padding:8px 13px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default;transform:none;filter:none}
.link{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* empty */
.empty{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:18px;padding:40px 22px;text-align:center}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:23px;margin:0 0 6px;text-wrap:balance}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
.empty .btn{flex:none;padding-inline:22px}

/* section heads */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hero);color:var(--hero-fg)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi b small{font-size:.5em;color:var(--muted);font-weight:700;margin-left:2px}
.kpi p{margin:6px 0 0;color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
@media (max-width:820px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0}
.panel .sub{color:var(--muted);margin:2px 0 12px;font-size:13.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg.chart .hit{fill:transparent}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.ppl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.ppl th,.ppl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ppl th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ppl tr:last-child td{border-bottom:0}
.ppl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.ppl .mini{display:flex;align-items:center;gap:8px}
.ppl .mini .meter{width:90px;margin:0}
.ppl .person{display:flex;align-items:center;gap:10px;font-weight:700}
.ppl .person .av{width:28px;height:28px;font-size:11px;box-shadow:none}
.scroll{overflow-x:auto}

/* week table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table.wk{border-collapse:collapse;width:100%;min-width:780px;font-size:13.5px}
.wk th,.wk td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.wk th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2)}
.wk th.today{color:var(--accent)}
.wk tr:last-child td{border-bottom:0}
.wk td.name{font-weight:700;position:sticky;left:0;background:var(--surface);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.wk td.cell{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.wk td.cell span{padding:3px 7px;border-radius:7px;background:var(--in-soft);color:var(--ink)}
.wk td.cell.late span{background:var(--late-soft);color:var(--late);font-weight:600}
.wk td.cell.home span{background:var(--home-soft);color:var(--home);font-weight:600}

.wk td.cell.leave span{background:var(--leave-soft);color:var(--leave);font-family:var(--f-body);font-weight:700}
.wk td.cell.none{color:var(--faint)}
.wk td.num{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.wk th.num{text-align:right}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.icon{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon svg{width:18px;height:18px}
.icon[disabled]{opacity:.4;cursor:default}

/* team */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:780px){.cols{grid-template-columns:1fr}}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0 0 2px}
.form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:540px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink)}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.roster{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.roster li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.roster li{flex-wrap:wrap}
.roster li .who{flex:1 1 180px}
.roster .wfh{display:flex;align-items:center;gap:8px;flex-basis:100%;padding-left:48px;flex-wrap:wrap}
.roster .wfh span{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
@media (max-width:480px){.roster .wfh{padding-left:0}}
.roster .av{box-shadow:none;width:38px;height:38px;font-size:13px}
.settings{display:grid;gap:12px}
.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tooltip + toast */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--hero);color:var(--hero-fg);padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:240px}
.tip b{font-family:var(--f-mono);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--hero-fg);border-radius:14px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:20;max-width:calc(100vw - 32px);font-weight:700;font-size:14px}
.toast button{border:0;background:var(--hero-fg);color:var(--hero);border-radius:9px;padding:6px 12px;font-weight:800;font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .22s ease}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
}

/* ===== calmer, cleaner surfaces (purple B3 look kept) ===== */
:root{--shadow:0 1px 2px rgba(28,19,38,.04)}
.card,.panel,.kpi,.tablewrap{box-shadow:none;border-color:var(--line)}
.card{border-radius:18px;padding:18px;gap:12px;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--line-2);box-shadow:0 6px 18px rgba(44,18,64,.06)}
.stamp{background:transparent;padding:0;min-height:0}
.bulk,.daybar{box-shadow:none}
.links{gap:12px}
.link{font-weight:600;font-size:12.5px;color:var(--muted);text-decoration:none}
.link:hover{color:var(--accent);text-decoration:underline}
.chipbtn{border-color:transparent;background:var(--surface)}
.empty{border-style:solid;border-color:var(--line)}
.who strong{font-size:15.5px}
.face{padding:24px 26px}
/* ===== motion: short, soft, and off when the device asks for less motion ===== */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #view.enter>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  #view.enter>*:nth-child(2){animation-delay:.04s} #view.enter>*:nth-child(3){animation-delay:.08s}
  #view.enter>*:nth-child(4){animation-delay:.12s} #view.enter>*:nth-child(n+5){animation-delay:.16s}
  #view.enter .grid>.card{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  #view.enter .grid>.card:nth-child(1){animation-delay:.10s}#view.enter .grid>.card:nth-child(2){animation-delay:.14s}
  #view.enter .grid>.card:nth-child(3){animation-delay:.18s}#view.enter .grid>.card:nth-child(4){animation-delay:.22s}
  #view.enter .grid>.card:nth-child(5){animation-delay:.26s}#view.enter .grid>.card:nth-child(6){animation-delay:.30s}
  #view.enter .grid>.card:nth-child(n+7){animation-delay:.34s}
  #view.enter .track-fill,#view.enter .meter span,#view.enter .hb-t i{transform-origin:left;animation:grow .8s .15s cubic-bezier(.2,.7,.2,1) both}
  #view.enter svg.chart rect:not(.hit){animation:fadein .6s .2s ease both}
  .card.pop{animation:pop .45s ease,glow .9s ease}
  .card.pop .pill{animation:fadein .35s ease}
  .tabs button{transition:background .2s,color .2s}
  .btn,.chipbtn,.icon,.link,.lvbtn,.stbtn{transition:transform .12s ease,filter .15s,background .2s,color .2s}
  .btn:active,.chipbtn:active,.lvbtn:active,.stbtn:active{transform:scale(.97)}
  .editbox,.rename{animation:rise .25s ease both}
  .pdfov:not([hidden]) .pdfbox{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
  .pdfov:not([hidden]){animation:fadein .2s ease both}
}

/* ---- reminder, week summary, upcoming leave, history, holidays, emails ---- */
.remind{display:flex;gap:12px;align-items:center;background:var(--late-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.remind .ricon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--late);flex:none}
.remind .ricon svg{width:18px;height:18px}
.remind b{display:block;font-weight:800}.remind span{font-size:13px;color:var(--muted)}
.panels.p2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:820px){.panels.p2{grid-template-columns:1fr}}
.wsum{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.wsum th{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.wsum td{padding:8px;border-bottom:1px solid var(--line)}.wsum tr:last-child td{border-bottom:0}
.wsum td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dl svg{width:12px;height:12px}.dl.good{color:var(--in)}.dl.bad{color:var(--leave)}
.upl{list-style:none;margin:6px 0 0;padding:0}
.upl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.upl li:first-child{border-top:0}
.upl .person{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.upl .person b{display:block;font-weight:700}.upl small{display:block;font-size:12px;color:var(--muted)}
.upl .av{width:32px;height:32px;font-size:12px;flex:none}
.upr{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.upnone{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.nmlink{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;max-width:100%}
.nmlink:hover strong,.nmlink:hover b,button.nmlink.person:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.nmlink.person{display:inline-flex;align-items:center;gap:10px}
.who .nmlink{display:block;overflow:hidden}
.phbox{width:min(560px,100%)}
.phbox .pdfbar .who strong{font-size:16px}.phbox .pdfbar .who small{display:block;color:var(--muted);font-size:12.5px}
.phbody{padding:14px 16px 18px;overflow:auto}
.phmonth{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.phmonth b{font-weight:800;font-size:15px}
.phstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:14px}
.phstats div{background:var(--surface-2);border-radius:12px;padding:9px 8px}
.phstats b{display:block;font-size:19px;font-weight:800;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.phstats span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
.phstats i{width:7px;height:7px;border-radius:50%;flex:none}
@media (max-width:480px){.phstats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.phcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.phh{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.05em;text-transform:uppercase;padding-bottom:2px}
.phd{border:0;border-radius:10px;min-height:48px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;background:var(--surface-2);color:var(--ink);cursor:pointer}
.phd b{font-size:13px;font-weight:800}.phd span{font-size:9.5px;font-weight:700;display:flex;align-items:center;gap:3px;min-height:12px}
.phd.blank{background:none;cursor:default}
.phd.c-p{background:var(--in-soft);color:var(--in)}.phd.c-wfh{background:var(--home-soft);color:var(--home)}
.phd.c-lv{background:var(--lvs);color:var(--lv)}.phd.c-off{background:none;color:var(--faint,var(--muted));opacity:.75}
.phd.c-empty{color:var(--muted)}
.phd.now{box-shadow:inset 0 0 0 2px var(--accent)}
.phd .ndot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
.phload{padding:40px 0;text-align:center;color:var(--muted)}
.phbody h4{margin:16px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.phnotes{list-style:none;margin:0;padding:0}.phnotes li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.phnotes b{flex:none;width:92px;font-weight:700}
.holp{margin-top:12px}
.holform{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.holform .inp{flex:1 1 150px;width:auto}
.hollist{list-style:none;margin:0;padding:0}

<script>
/* Standalone runtime: stores data in the Google Sheet through Apps Script,
   and offers the same small API the page was written against. */
(function(){
  const store={}; const listeners=new Set(); let ready=null, pending=0;
  const PIN_KEY="b3-punch-clock:admin"; let PIN=null; try{PIN=localStorage.getItem(PIN_KEY)}catch(e){}
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const API=(window.PC_API_URL||"").trim(), useFetch=/^https:\/\/script\.google\.com\/.+\/exec$/.test(API);
  async function callFetch(fn,args){
    let r;
    try{r=await fetch(API,{method:"POST",body:JSON.stringify({fn,args}),redirect:"follow"})}catch(e){throw {code:"unavailable",message:"No connection to the attendance sheet"}}
    let out; try{out=await r.json()}catch(e){throw {code:"unavailable",message:"The attendance sheet didn't answer. Check the link in config.js."}}
    if(!out.ok){const m=String(out.error||"");throw {code:/invalid_argument/.test(m)?"invalid_argument":"unavailable",message:m}}
    return out.result;
  }
  function call(fn,...args){
    if(useFetch)return callFetch(fn,args);
    return new Promise((res,rej)=>{
      if(!(window.google&&google.script&&google.script.run)){rej({code:"unavailable",message:"No attendance sheet connected. Add your Google link to config.js."});return}
      google.script.run.withSuccessHandler(res).withFailureHandler(e=>{const m=String(e&&e.message||e);rej({code:/invalid_argument/.test(m)?"invalid_argument":"unavailable",message:m})})[fn](...args);
    });
  }
  let notifyQueued=false;
  function notify(){if(notifyQueued)return;notifyQueued=true;Promise.resolve().then(()=>{notifyQueued=false;listeners.forEach(f=>{try{f()}catch(e){console.error(e)}})})}
  async function refresh(force){
    if(pending&&!force)return; // never overwrite local changes that are still saving
    const all=JSON.parse(await call("getAll"));
    if(pending)return;
    let changed=Object.keys(store).length!==Object.keys(all).length;
    Object.keys(store).forEach(k=>{if(!(k in all)){delete store[k];changed=true}});
    Object.keys(all).forEach(k=>{let v;try{v=JSON.parse(all[k])}catch(e){return}
      if(JSON.stringify(store[k])!==JSON.stringify(v)){store[k]=v;changed=true}});
    if(changed)notify();
  }
  /* Saves are instant on screen. They go to the sheet one at a time in the background,
     in the order they were made. If one fails, the screen is brought back in line with the sheet. */
  let queue=Promise.resolve(), failed=false;
  const pill=document.createElement("div"); pill.className="syncpill"; pill.setAttribute("role","status"); pill.hidden=true;
  const st=document.createElement("style"); st.textContent=".syncpill{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--surface,#fff);color:var(--muted,#6B6178);border:1px solid var(--line,#E8E3EE);border-radius:999px;padding:6px 12px 6px 10px;font:600 12.5px/1.2 Figtree,system-ui,sans-serif;box-shadow:0 6px 20px rgba(28,19,38,.12)}.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--accent,#6A2E8E);animation:pcpulse 1s ease-in-out infinite}.syncpill.ok i{background:var(--in,#11885A);animation:none}@keyframes pcpulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.syncpill i{animation:none}}";
  document.head.appendChild(st);
  let pillT=null,okT=null;
  function showSync(){
    clearTimeout(okT);
    if(pending){if(pill.hidden&&!pillT)pillT=setTimeout(()=>{pillT=null;if(pending){pill.className="syncpill";pill.innerHTML="<i></i>Saving…";pill.hidden=false}},500);return}
    clearTimeout(pillT);pillT=null;
    if(!pill.hidden){pill.className="syncpill ok";pill.innerHTML="<i></i>Saved";okT=setTimeout(()=>{pill.hidden=true},1200)}
  }
  (document.body?Promise.resolve():new Promise(r=>document.addEventListener("DOMContentLoaded",r))).then(()=>document.body.appendChild(pill));
  function write(fn,path,body,local){
    local(); notify(); pending++; showSync();
    const job=()=>(body==null?call(fn,path,PIN||""):call(fn,path,JSON.stringify(body),PIN||""));
    queue=queue.then(job).catch(e=>{failed=true;window.dispatchEvent(new CustomEvent("pc-save-error",{detail:e}))})
      .finally(()=>{pending--;showSync();if(!pending&&failed){failed=false;refresh(true).catch(()=>{})}});
    return Promise.resolve();
  }
  window.addEventListener("beforeunload",e=>{if(pending){e.preventDefault();e.returnValue=""}});
  function snapDoc(path){const v=store[path];return {id:path.split("/").pop(),exists:v!==undefined,data:()=>v===undefined?undefined:clone(v),metadata:{fromCache:false,hasPendingWrites:pending>0}}}
  function docRef(path){
    return {id:path.split("/").pop(),path,
      get:async()=>{await ready;return snapDoc(path)},
      set:d=>write("setDoc",path,d,()=>{store[path]=clone(d)}),
      update:d=>{if(!(path in store))return Promise.reject({code:"invalid_argument",message:"Document does not exist"});
        return write("updateDoc",path,d,()=>{store[path]={...store[path],...clone(d)}})},
      delete:()=>write("deleteDoc",path,null,()=>{delete store[path]}),
      onSnapshot:(next,err)=>{const f=()=>next(snapDoc(path));listeners.add(f);ready.then(f,e=>err&&err(e));return()=>listeners.delete(f)},
      collection:sub=>query(path+"/"+sub,[],null,null)};
  }
  function match(v,op,x){switch(op){case"==":return v===x;case"!=":return v!==x;case"<":return v<x;case"<=":return v<=x;case">":return v>x;case">=":return v>=x;
    case"in":return Array.isArray(x)&&x.includes(v);case"not-in":return Array.isArray(x)&&!x.includes(v);case"array-contains":return Array.isArray(v)&&v.includes(x);default:return false}}
  function run(col,filters,order,lim){
    const depth=col.split("/").length+1;
    let keys=Object.keys(store).filter(k=>k.startsWith(col+"/")&&k.split("/").length===depth)
      .filter(k=>filters.every(([f,op,x])=>match(store[k][f],op,x)));
    if(order){const [f,dir]=order;keys.sort((a,b)=>{const A=store[a][f],B=store[b][f];if(A===B)return 0;if(A===undefined)return 1;if(B===undefined)return -1;return (A<B?-1:1)*(dir==="desc"?-1:1)})}
    else keys.sort();
    if(lim)keys=keys.slice(0,lim);
    const docs=keys.map(snapDoc);
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:pending>0}};
  }
  function query(col,filters,order,lim){
    return {path:col,
      where:(f,op,x)=>query(col,[...filters,[f,op,x]],order,lim),
      orderBy:(f,dir)=>query(col,filters,[f,dir||"asc"],lim),
      limit:n=>query(col,filters,order,n),

function dailyChart(daily){
  const W=720,H=230,L=30,B=26,T=8,R=6, n=daily.length, max=Math.max(1,S.people.length);
  const cw=(W-L-R)/n, bw=Math.max(4,Math.min(34,cw*.62)), y=v=>T+(H-T-B)*(1-v/max);
  let g="";
  const ticks=max<=4?Array.from({length:max+1},(_,i)=>i):[0,Math.round(max/2),max];
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`});
  const every=n>14?5:n>7?2:1;
  daily.forEach((x,i)=>{
    const cx=L+cw*i+cw/2, x0=cx-bw/2;
    const lbl=n<=7?x.d.toLocaleDateString(undefined,{weekday:"short"}):x.d.getDate();
    if(i%every===0||i===n-1)g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${lbl}</text>`;
    if(!x.active){g+=`<line x1="${cx-4}" x2="${cx+4}" y1="${y(0)-2}" y2="${y(0)-2}" stroke="var(--line-2)" stroke-width="2" stroke-linecap="round"/>`;return}
    let acc=0;
    [["office","var(--in)"],["home","var(--home)"],["leave","var(--leave)"],["absent","var(--absent)"]].forEach(([k,c])=>{
      const v=x[k]; if(!v)return;
      const y1=y(acc+v), y0=y(acc); const hgt=Math.max(1,y0-y1-(acc>0?2:0));
      g+=`<rect x="${x0}" y="${y1}" width="${bw}" height="${hgt}" rx="3" fill="${c}"/>`; acc+=v;
    });
    const date=x.d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
    const tipT=`${esc(date)}<br>Office <b>${x.office}</b> · Home <b>${x.home}</b><br>Leave <b>${x.leave}</b> · Out of office <b>${x.absent}</b>`;
    g+=`<rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}" data-tip="${esc(tipT)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily attendance, stacked by status">${g}</svg>`;
}

/* ---------- daily report ---------- */
const GROUP_ORDER={p:0,wfh:1,annual:2,sick:2,emergency:2,half:2,other:2,ooo:3,off:4,"":5};
function dayRecsCached(k){
  if(k===vKey())return S.today;
  const m={},d=dateOf(k),from=daysBack(30)[0];
  if(d<from)return null;
  S.people.forEach(p=>{const r=S.hist[k+"_"+p.id];if(r)m[p.id]=r});
  return m;
}
async function dayRecsFetch(k){
  const c=dayRecsCached(k); if(c)return c;
  const snap=await db.collection("log").where("date","==",k).limit(1000).get();
  const m={}; snap.docs.forEach(x=>{const r=x.data();if(r&&r.pid)m[r.pid]=r}); return m;
}
function daySummary(k,recs){
  const d=dateOf(k), tk=key(new Date());
  const rows=S.people.filter(p=>joined(p,k)).map(p=>{const r=recs[p.id];return {p,r,cf:cellFor(r,d,tk,p)}})
    .sort((a,b)=>(GROUP_ORDER[a.cf.code]-GROUP_ORDER[b.cf.code])||a.p.name.localeCompare(b.p.name));
  const c={p:0,wfh:0,leave:0,ooo:0,off:0,total:rows.length};
  rows.forEach(x=>{const k2=x.cf.code;if(k2==="p")c.p++;else if(k2==="wfh")c.wfh++;else if(LEAVE[k2])c.leave++;else if(k2==="ooo")c.ooo++;else if(k2==="off")c.off++});
  return {d,k,rows,c,sc:sched(d)};
}
function dayLong(d){return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function statusText(x){const k=x.cf.code;return k==="p"?"Present":k==="wfh"?"Present (WFH)":k==="ooo"?"Out of Office":k==="off"?"Day off":x.cf.label||""}
function emailText(sum){
  const {d,rows,c,sc}=sum, L=[];
  L.push("Daily Attendance Report – "+dayLong(d));
  L.push((S.settings.teamName||"B3 International")+(sc.holiday?" · Public holiday: "+sc.holiday:sc.on?" · Working day":" · Non-working day"));
  L.push("");
  L.push("Present: "+(c.p+c.wfh)+" of "+c.total+"  (In office "+c.p+", Working from home "+c.wfh+")");
  L.push("On leave: "+c.leave+"   Out of office: "+c.ooo);
  const grp=(title,list,fmt)=>{if(!list.length)return;L.push("");L.push(title+" ("+list.length+")");list.forEach(x=>L.push("  • "+fmt(x)))};
  const t=x=>"";
  grp("In office",rows.filter(x=>x.cf.code==="p"),x=>x.p.name+t(x));
  grp("Working from home",rows.filter(x=>x.cf.code==="wfh"),x=>x.p.name+t(x));
  grp("On leave",rows.filter(x=>LEAVE[x.cf.code]),x=>x.p.name+" – "+x.cf.label);
  grp("Out of office",rows.filter(x=>x.cf.code==="ooo"),x=>x.p.name);
  const notes=rows.filter(x=>x.cf.note);
  grp("Notes",notes,x=>x.p.name+": "+x.cf.note);
  L.push(""); L.push("Sent from Punch Clock");
  return L.join("\n");
}
async function openMail(k){
  if(!db){noDb();return}
  try{const recs=await dayRecsFetch(k);S.mail={k,text:emailText(daySummary(k,recs))};render();
    setTimeout(()=>{const x=document.getElementById("mailtxt");x&&x.scrollIntoView({block:"nearest",behavior:"smooth"})},0)}
  catch(e){toast("Couldn't load that day. Try again.")}
}
function copyMail(){
  const ta=document.getElementById("mailtxt"); if(!ta||!S.mail)return;
  const fallback=()=>{ta.focus();ta.select();toast("Text selected. Press Ctrl+C (or ⌘C) to copy.")};
  try{navigator.clipboard.writeText(S.mail.text).then(()=>toast("Copied. Paste it into your email."),fallback)}catch(e){fallback()}
}

    case "goteam":S.tab="team";render();setTimeout(()=>{const x=document.getElementById("pName");x&&x.focus()},0);break;
    case "prev":S.weekOffset--;subWeek();render();break;
    case "next":if(S.weekOffset<0){S.weekOffset++;subWeek();render()}break;
    case "csv":exportCsv();break;
    case "hrsend":openHR(b.dataset.k||vKey());break;
    case "mrepx":S.month=b.dataset.ym;exportExcel();LS.set("mrep-"+b.dataset.ym,"1");setTimeout(render,400);break;
    case "mrepp":S.month=b.dataset.ym;makePdf("month");LS.set("mrep-"+b.dataset.ym,"1");setTimeout(render,400);break;
    case "mrepdone":LS.set("mrep-"+b.dataset.ym,"1");render();toast(monthName(b.dataset.ym)+" report hidden. It's always on the Reports tab.");break;
    case "dpdf":makePdf("day");break;
    case "mpdf":makePdf("month");break;
    case "dxlsx":exportDaily(S.day||todayKey);break;
    case "dmail":openMail(S.day||todayKey);break;
    case "copymail":copyMail();break;
    case "closemail":S.mail=null;render();break;
    case "dayprev":shiftView(-1);break;
    case "daynext":shiftView(1);break;
    case "daytoday":setView(null);break;
    case "goreport":S.tab="week";S.day=vKey();S.mail=null;render();window.scrollTo({top:0});break;
    case "xlsx":exportExcel();break;
    case "rm":S.removing=id;render();break;
    case "rmcancel":S.removing=null;render();break;
    case "rmok":{if(!db){noDb();break}const name=personName(id);S.removing=null;render();db.doc("people/"+id).delete().then(()=>toast(name+" removed")).catch(fail);break}
  }
});
view.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!S.canWrite)return; if(!db){noDb();return}
  if(e.target.id==="addForm"){
    const name=String(S.draft.pName||"").trim().replace(/\s+/g," "), role=String(S.draft.pRole||"").trim();
    if(!name){const x=document.getElementById("pName");x&&x.focus();toast("Type a name first.");return}
    try{await db.collection("people").add({name,role,added:new Date().toISOString()});S.draft.pName="";S.draft.pRole="";render();
      const x=document.getElementById("pName");x&&x.focus();toast(name+" added")}catch(err){fail(err)}
  }
  const D=S.draft,s=S.settings;
  const base=()=>({...S.settings,teamName:String(s.teamName||""),grace:grace(),hours:hoursTable()});
  if(e.target.id==="holForm"){
    const dt=String(D.holDate||""), nm=String(D.holName||"").trim()||"Public holiday";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){toast("Pick the holiday date first.");return}
    const list=(S.settings.holidays||[]).filter(x=>x&&x.date!==dt).concat([{date:dt,name:nm}]).sort((a,b)=>a.date.localeCompare(b.date));
    await saveSettings({holidays:list,holOff:(S.settings.holOff||[]).filter(x=>x!==dt)},nm+" added");D.holDate="";D.holName="";render();
  }
  if(e.target.id==="mailForm"){
    const M=mailCfg(), cfg={...(S.settings.autoMail||{}),remind:!!M.remind,remindAt:M.remindAt||"10:00"};
    if(await saveSettings({autoMail:cfg},"Reminder saved"))D.mail=null;render();
  }
  if(e.target.id==="teamForm"){
    try{await db.doc("settings/main").set({...base(),teamName:String(D.sTeam==null?s.teamName:D.sTeam).trim()});D.sTeam=null;toast("Team name saved")}catch(err){fail(err)}
  }
  if(e.target.id==="schedForm"){
    const H=draftHours();
    try{await db.doc("settings/main").set({...base(),hours:H.map(x=>({on:!!x.on,start:x.start,end:x.end}))});
      D.hours=null;toast("Schedule saved")}catch(err){fail(err)}
  }
});

async function saveSettings(patch,msg,undo){
  if(!db){noDb();return false} if(!S.canWrite)return false;
  try{await db.doc("settings/main").set({...DEFAULTS,...S.settings,hours:hoursTable(),...patch});if(msg)toast(msg,undo);return true}catch(e){fail(e);return false}
}
window.addEventListener("pc-save-error",e=>fail(e.detail));
/* ---------- keyboard shortcuts (desktop) ---------- */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement; if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
  if(S.ph||S.bk||S.pdf||!document.getElementById("pinov").hidden)return;
  if(e.key==="ArrowLeft"&&S.tab==="today"){e.preventDefault();shiftView(-1)}
  else if(e.key==="ArrowRight"&&S.tab==="today"){e.preventDefault();shiftView(1)}
  else if(e.key==="/"){e.preventDefault();if(S.tab!=="today"){S.tab="today";S.anim=true;render()}const q=document.getElementById("q");q&&q.focus()}
  else if(e.key==="t"&&S.tab==="today"){setView(null)}
  else if(e.key==="?"){toast("Shortcuts: ← → change day · T today · / search")}
});
/* ---------- swipe a card on phones: right = Present, left = Leave ---------- */
let SW=null, swClick=0;
view.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="touch"||!S.canWrite||S.tab!=="today")return;
  const c=e.target.closest(".card[data-pid]"); if(!c||c.classList.contains("wide")||e.target.closest("input,textarea,select"))return;
  SW={c,id:c.dataset.pid,x:e.clientX,y:e.clientY,dx:0,on:false};
});
view.addEventListener("pointermove",e=>{
  if(!SW)return; const dx=e.clientX-SW.x, dy=e.clientY-SW.y;
  if(!SW.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){SW=null;return} if(Math.abs(dx)<14)return; SW.on=true;SW.c.classList.add("swiping");try{SW.c.setPointerCapture(e.pointerId)}catch(_){}}
  SW.dx=dx; SW.c.style.transition="none"; SW.c.style.transform=`translateX(${dx*.85}px) rotate(${dx/60}deg)`;
  SW.c.dataset.sw=dx>0?"r":"l"; SW.c.classList.toggle("armed",Math.abs(dx)>90);
});
function swEnd(){
  if(!SW)return; const {c,id,dx,on}=SW; SW=null; if(!on)return;
  swClick=Date.now(); c.style.transition="transform .45s cubic-bezier(.32,.72,0,1)"; c.style.transform=""; c.classList.remove("swiping","armed"); delete c.dataset.sw;
  if(Math.abs(dx)<=90)return;
  LS.set("swhint","1");
  if(dx>0){if(statusOf(id)!=="in")markPresent(id);else toast(personName(id)+" is already marked present")}
  else{S.confirm="lv:"+id;render()}
}
view.addEventListener("pointerup",swEnd); view.addEventListener("pointercancel",swEnd);
view.addEventListener("click",e=>{if(Date.now()-swClick<350){e.stopPropagation();e.preventDefault()}},true);
/* ---------- admin PIN ---------- */
const pinov=document.getElementById("pinov");
function openPin(){pinov.hidden=false;document.getElementById("pinErr").hidden=true;const i=document.getElementById("pinIn");i.value="";setTimeout(()=>i.focus(),30)}
document.getElementById("adminBtn").addEventListener("click",()=>{
  if(S.canWrite){window.PC_ADMIN.lock();S.canWrite=false;S.edit=null;S.rename=null;S.confirm=null;render();toast("Locked. Viewing only.")}
  else openPin();
});
document.getElementById("pinCancel").addEventListener("click",()=>{pinov.hidden=true});
pinov.addEventListener("click",e=>{if(e.target===pinov)pinov.hidden=true});
document.getElementById("pinForm").addEventListener("submit",async e=>{
  e.preventDefault(); const go=document.getElementById("pinGo"); go.disabled=true;
  try{const ok=await window.PC_ADMIN.unlock(document.getElementById("pinIn").value);
    if(ok){pinov.hidden=true;S.canWrite=true;render();toast("Admin mode on. You can make changes.")}
    else{document.getElementById("pinErr").hidden=false;document.getElementById("pinIn").select()}}
  catch(err){toast("Couldn't check the PIN. Check your connection.")}
  finally{go.disabled=false}
});
window.addEventListener("pc-admin",()=>{S.canWrite=false;render()});

/* ---------- clock ---------- */
let lastMin=new Date().getMinutes();
setInterval(()=>{
  const now=new Date();
  const k=key(now); if(k!==todayKey){todayKey=k;if(!viewKey)subToday();subHist()}
  if(now.getMinutes()!==lastMin){lastMin=now.getMinutes();if(!typing())render()}
  tickClock();
},1000);

/* ---------- data ---------- */
function subToday(){
  if(!db)return; if(unToday)unToday(); S.today={};
  unToday=db.collection("log").where("date","==",vKey()).onSnapshot(s=>{
    const m={};s.docs.forEach(d=>{const r=d.data();if(r&&r.pid)m[r.pid]=r});S.today=m;render();
  },()=>{});
}
function subWeek(){
  if(!db)return; if(unWeek)unWeek();
  const d=weekDays(S.weekOffset); S.week={};
  unWeek=db.collection("log").where("date",">=",key(d[0])).where("date","<=",key(d[6])).limit(1000).onSnapshot(s=>{
    const m={};s.docs.forEach(x=>{const r=x.data();if(r&&r.pid)m[r.date+"_"+r.pid]=r});S.week=m;if(S.tab==="week")render();
  },()=>{});
}
function subHist(){
  if(!db)return; if(unHist)unHist();
  const from=key(daysBack(30)[0]);
  unHist=db.collection("log").where("date",">=",from).limit(1000).onSnapshot(s=>{
    const m={};s.docs.forEach(x=>{const r=x.data();if(r&&r.pid)m[r.date+"_"+r.pid]=r});S.hist=m;if(S.tab==="dash")render();
  },()=>{});
}
async function start(){
  S.canWrite=!!(window.PC_ADMIN&&window.PC_ADMIN.is());
  render();
  if(!window.claude||!window.claude.use){S.offline=true;S.ready=true;render();return}
  db=await window.claude.use("db");
  if(!db){S.offline=true;S.ready=true;render();return}
  window.claude.use("downloads").then(d=>{downloads=d;if(S.tab==="week")render()});
  window.claude.use("user").then(async u=>{if(u){const c=await u.can("data.write");if(c===false){S.canWrite=false;render()}}});
  db.collection("people").onSnapshot(s=>{
    S.people=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.name).sort((a,b)=>a.name.localeCompare(b.name));
    S.ready=true;render();
  },()=>{S.ready=true;render()});
  db.doc("settings/main").onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};render();if(S.ph&&S.ph.recs)renderPh()},()=>{});
  subToday(); subWeek(); subHist();
  if(/[?&]book\b/.test(location.search))setTimeout(()=>{if(S.canWrite)openBook(null)},900);
}
start();
})();
</script>
