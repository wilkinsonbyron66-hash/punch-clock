<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003660">
<title>Minerva Priorities</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003660; --navy2:#004679; --navy3:#005a92; --cyan:#00B7ED; --cyan-soft:#E3F6FD;
  --bg:#EEF3F7; --surface:#FFFFFF; --surface-2:#F4F7FA; --line:#DCE5ED; --line-2:#C5D3DF;
  --ink:#0F2233; --muted:#5E7184; --faint:#9AABBA;
  --p1:#D6453D; --p1s:#FCE4E2; --p2:#E19A1C; --p2s:#FDF1DA; --p3:#2E86DE; --p3s:#E1EEFB; --p4:#6B7C8F; --p4s:#EBEFF3;
  --ok:#16A36A; --oks:#DDF4EA; --warn:#B26A00; --warns:#FFF2D9; --bad:#B42318; --bads:#FDE7E4;
  --sh:0 1px 2px rgba(0,40,70,.05),0 2px 10px rgba(0,40,70,.06);
  --f:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1824; --surface:#122334; --surface-2:#172B3F; --line:#22394F; --line-2:#2E4A64;
  --ink:#E6EEF5; --muted:#9DB0C2; --faint:#6F8599; --cyan-soft:#0E3448;
  --p1s:#3E1B19; --p2s:#3A2C12; --p3s:#132D47; --p4s:#22313F; --oks:#123526; --warns:#3A2A0E; --bads:#3E1A17;
  --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1824; --surface:#122334; --surface-2:#172B3F; --line:#22394F; --line-2:#2E4A64;
  --ink:#E6EEF5; --muted:#9DB0C2; --faint:#6F8599; --cyan-soft:#0E3448;
  --p1s:#3E1B19; --p2s:#3A2C12; --p3s:#132D47; --p4s:#22313F; --oks:#123526; --warns:#3A2A0E; --bads:#3E1A17;
  --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:15px}
html.present{font-size:17.5px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 65%,var(--navy3) 100%);color:#fff;box-shadow:0 2px 14px rgba(0,30,60,.18)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .div{width:1px;height:28px;background:rgba(255,255,255,.3)}
.brand b{font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.75;font-weight:500;white-space:nowrap}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;color:rgba(255,255,255,.8);padding:7px 13px;border-radius:9px;font-weight:600;font-size:14.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy)}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn svg{width:16px;height:16px}
.hbtn[aria-pressed="true"]{background:#fff;color:var(--navy)}
@media (max-width:760px){.tabs{order:3;width:100%}.brand img{height:24px}}

main{padding:18px 0 80px}
.btn{border:0;border-radius:10px;background:var(--navy2);color:#fff;padding:9px 14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--navy)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.ok{background:var(--ok)} .btn.ok:hover{filter:brightness(.95)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:15px;min-width:0}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.4}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.panel h2,.panel h3{margin:0 0 4px;font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}

/* top strip */
.today{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.today h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--navy2)}
:root[data-theme="dark"] .today h1{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .today h1{color:#fff}}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px;text-align:left;cursor:pointer}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.kpi[aria-pressed="true"]{border-color:var(--navy2);box-shadow:0 0 0 2px var(--cyan-soft)}
.meet{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.meet .mtxt{font-weight:700;white-space:nowrap}
.meet .mtxt small{font-weight:500;color:var(--muted);margin-left:6px}
.meet .mbar{flex:1;min-width:120px;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meet .mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--ok));border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search .inp{padding-left:35px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--navy2);color:#fff}
.spacer{flex:1}

/* people stepper */
.people{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;white-space:nowrap}
.chip .n{font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 7px}
.chip .n.bad{background:var(--bads);color:var(--bad)}
.chip[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.18);color:#fff}
.chip.all{padding-left:12px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.focushead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.focushead .av{width:44px;height:44px;font-size:16px}
.focushead h2{margin:0;font-size:24px;font-weight:800}
.focushead p{margin:0;color:var(--muted);font-size:14px}

/* groups + rows */
.group{margin-bottom:18px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:0 2px}
.ghead h3{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.ghead .count{font-size:13px;color:var(--muted);font-weight:600}
.ghead .dot{width:10px;height:10px;border-radius:3px}
.list{display:flex;flex-direction:column;gap:6px}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 14px 11px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s,opacity .3s}
.row:hover{border-color:var(--line-2);box-shadow:var(--sh)}
.row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pc,var(--p4))}
.row.p1{--pc:var(--p1)} .row.p2{--pc:var(--p2)} .row.p3{--pc:var(--p3)} .row.p4{--pc:var(--p4)}
.row.seen{background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 7%,var(--surface)),var(--surface) 40%)}
.row .t{font-weight:700;font-size:16px;line-height:1.25}
.row .meta{font-size:13.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .meta b{color:var(--ink);font-weight:600}
.row .last{grid-column:1/-1;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:baseline;min-width:0}
.row .last time{font-weight:700;color:var(--navy2);white-space:nowrap;font-size:13px}
:root[data-theme="dark"] .row .last time{color:var(--cyan)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row .last time{color:var(--cyan)}}
.row .last span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .last em{font-style:normal;color:var(--faint);white-space:nowrap;font-size:12.5px}
.row .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.owners{display:inline-flex}
.owners .av{width:26px;height:26px;margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.owners .av:first-child{margin-left:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;border:0}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.st-ns{background:var(--surface-2);color:var(--muted)} .st-on{background:var(--cyan-soft);color:var(--navy2)} .st-wait{background:var(--warns);color:var(--warn)} .st-done{background:var(--oks);color:var(--ok)}
:root[data-theme="dark"] .st-on{color:var(--cyan)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-on{color:var(--cyan)}}
button.pill{cursor:pointer}
.due{font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.due.over{background:var(--bads);color:var(--bad)} .due.today{background:var(--warns);color:var(--warn)} .due.soon{background:var(--cyan-soft);color:var(--navy2)}
.stale{font-size:12px;font-weight:700;color:var(--warn);background:var(--warns);padding:2px 8px;border-radius:99px;white-space:nowrap}
.seentag{font-size:12px;font-weight:700;color:var(--ok);background:var(--oks);padding:2px 8px;border-radius:99px;white-space:nowrap}
.qa{display:inline-flex;gap:6px}
.icon{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--muted)}
.icon:hover{color:var(--navy2);border-color:var(--line-2)}
.icon svg{width:17px;height:17px}
.icon.okh:hover{color:var(--ok);border-color:var(--ok);background:var(--oks)}
@media (max-width:720px){.row{grid-template-columns:1fr}.row .right{justify-content:flex-start}}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:16px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.quick{display:flex;gap:8px;margin-top:6px}
.quick .inp{font-size:14px;padding:7px 10px}

/* board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:180px;border-top:4px solid var(--pc)}
.quad.drag{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--pc)}
.quad h3{margin:2px 4px 2px;font-size:16px;font-weight:800;display:flex;justify-content:space-between}
.quad p{margin:0 4px 10px;color:var(--muted);font-size:13px}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:grab;display:flex;gap:8px;align-items:center}
.card:active{cursor:grabbing}
.card .ct{flex:1;min-width:0}
.card .ct b{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
.card .ct small{color:var(--muted);font-size:12.5px}

/* summary */
.sumgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.sumgrid{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:center;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:800;border-top:2px solid var(--line)}
td .z{color:var(--faint)}
td.bad{color:var(--bad);font-weight:700}
.clickn{cursor:pointer;border-radius:6px}
.clickn:hover{background:var(--surface-2)}
.person{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.scroll{overflow-x:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,35,.42);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,20,40,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:18px;flex:1}
.dbody{padding:14px 16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.dfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.g2,.g3{grid-template-columns:1fr}}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--oc,var(--navy2));background:var(--os,var(--cyan-soft));color:var(--oc,var(--navy2))}
.opt.p1{--oc:var(--p1);--os:var(--p1s)} .opt.p2{--oc:var(--p2);--os:var(--p2s)} .opt.p3{--oc:var(--p3);--os:var(--p3s)} .opt.p4{--oc:var(--p4);--os:var(--p4s)}
.opt .sw{width:10px;height:10px;border-radius:3px;background:var(--oc)}
.ochips{display:flex;flex-wrap:wrap;gap:6px}
.ochips .opt{padding:4px 10px 4px 4px;border-radius:99px}
.quickdue{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.quickdue button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0}
.tl .u{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.tl .u:first-child{border-top:0}
.tl .u time{font-weight:700;color:var(--navy2);font-size:13.5px}
:root[data-theme="dark"] .tl .u time{color:var(--cyan)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl .u time{color:var(--cyan)}}
.tl .u p{margin:0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl .u .x{border:0;background:none;color:var(--faint);padding:0 2px;font-size:18px;line-height:1}
.tl .u .x:hover{color:var(--bad)}
.addu{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px}
.addu .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addu .row2 .inp{width:auto}
.hint{font-size:12.5px;color:var(--muted)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,20,35,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox .mh{padding:16px 18px 6px}.mbox .mh h2{margin:0;font-size:19px}
.mbox .mb{padding:6px 18px 12px;display:flex;flex-direction:column;gap:10px}
.mbox .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,20,40,.3);max-width:calc(100% - 32px)}
.toast button{border:0;background:#fff;color:var(--navy);border-radius:8px;padding:5px 11px;font-weight:700}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.settings{grid-template-columns:1fr}}
.staff{list-style:none;margin:8px 0 0;padding:0}
.staff li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.staff li:first-child{border-top:0}
.staff li span{flex:1;font-weight:600}
.addrow{display:flex;gap:8px}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.on{border-color:var(--cyan);background:var(--cyan-soft)}
.note{background:var(--cyan-soft);border-radius:12px;padding:10px 12px;font-size:14px}

@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .enter .group,.enter .panel,.enter .quad{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .enter .group:nth-child(2){animation-delay:.04s}.enter .group:nth-child(3){animation-delay:.08s}.enter .group:nth-child(n+4){animation-delay:.12s}
  .row.leaving{opacity:0;transform:translateX(24px)}
  .row.flash{animation:flash 1s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 0 0 0 transparent}}
  .toast{animation:rise .2s ease}
  .modal{animation:fade .15s ease}
  .btn:active,.icon:active,.opt:active{transform:scale(.97)}
}
@media (max-width:640px){.meet .mtxt{white-space:normal}.meet .mtxt small{display:none}.tools .eyebrow{display:none}.tools .seg{overflow-x:auto;max-width:100%}.search{max-width:none}
  .today h1{font-size:23px}.kpi{min-width:0;flex:1 1 30%;padding:7px 10px}.kpi b{font-size:20px}.focushead h2{font-size:20px}.focushead{flex-wrap:wrap}}
body{overflow-x:hidden}
@media print{header,.tools,.people,.meet,.qa,.icon{display:none!important}body{background:#fff}.row{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="logo-white.png" alt="Minerva"><span class="div"></span><div><b>Daily Priorities</b><small id="hsub">Morning meeting tracker</small></div></div>
    <nav class="tabs" role="tablist">
      <button data-tab="meet" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Meeting</button>
      <button data-tab="board" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>Priority board</button>
      <button data-tab="sum" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Summary</button>
      <button data-tab="done" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Completed</button>
      <button data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Data &amp; settings</button>
    </nav>
    <button class="hbtn" id="presentBtn" type="button" aria-pressed="false" title="Bigger text for screen sharing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Present</button>
    <button class="hbtn" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New task</button>
  </div>
</header>
<main class="wrap"><section id="view"></section></main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(()=>{
"use strict";
/* ================= storage ================= */
const KEY="minerva-tracker:v1", SNAP="minerva-tracker:snapshots";
const PRIO={1:{k:"p1",l:"Important and Urgent",s:"Do now"},2:{k:"p2",l:"Important and Not Urgent",s:"Schedule"},3:{k:"p3",l:"Not Important but Urgent",s:"Delegate"},4:{k:"p4",l:"Not Important, Not Urgent",s:"Later"}};
const STATUS={ns:"Not started",on:"Ongoing",wait:"Waiting",done:"Completed"};
const DEFAULT_STAFF=[];
let D=load();
function blank(){return {v:1,tasks:[],staff:DEFAULT_STAFF.slice(),seen:{},created:new Date().toISOString(),lastBackup:null}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.tasks))return {...blank(),...o}}}catch(e){}return blank()}
let saveT=null, storageOk=true;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D));storageOk=true}catch(e){storageOk=false;toast("Couldn't save on this computer. Download a backup from Data & settings.")}},120)}
// one automatic snapshot per day, last 14 kept
function snapshot(){try{const s=JSON.parse(localStorage.getItem(SNAP)||"[]");const k=todayKey();if(s.length&&s[s.length-1].d===k)return;if(!D.tasks.length)return;s.push({d:k,data:D});while(s.length>14)s.shift();localStorage.setItem(SNAP,JSON.stringify(s))}catch(e){}}

/* ================= dates (working days, UAE) ================= */
const HOL=new Set(["2026-01-01","2026-03-19","2026-03-20","2026-03-21","2026-05-26","2026-05-27","2026-05-28","2026-05-29","2026-06-15","2026-08-28","2026-12-02","2026-12-03",
  "2027-01-01","2027-03-09","2027-03-10","2027-03-11","2027-05-15","2027-05-16","2027-05-17","2027-05-18","2027-06-06","2027-08-14","2027-12-02","2027-12-03"]);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateOf=k=>{const [y,m,d]=String(k).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const todayKey=()=>key(new Date());
const isWork=d=>{const w=d.getDay();return w!==0&&w!==6&&!HOL.has(key(d))};
function addWork(k,n){const d=dateOf(k);let i=0;while(i<n){d.setDate(d.getDate()+1);if(isWork(d))i++}return key(d)}
function workBetween(a,b){/* working days after a up to and including b */let n=0;const d=dateOf(a),e=dateOf(b);while(d<e){d.setDate(d.getDate()+1);if(isWork(d))n++}return n}
function prevWork(k){const d=dateOf(k);do{d.setDate(d.getDate()-1)}while(!isWork(d));return key(d)}
const fmt=(k,o)=>k?dateOf(k).toLocaleDateString("en-GB",o||{day:"numeric",month:"short"}):"";
function dueInfo(t){
  if(t.status==="done")return {l:"Done",c:""};
  if(!t.target)return {l:"No target date",c:""};
  const tk=todayKey();
  if(t.target===tk)return {l:"Due today",c:"today",n:0};
  if(t.target>tk){const n=workBetween(tk,t.target);return {l:n<=1?"Due tomorrow":"Due in "+n+" working days",c:n<=2?"soon":"",n}}
  const n=Math.max(1,workBetween(t.target,tk));return {l:"Overdue by "+n+" working day"+(n>1?"s":""),c:"over",n:-n,over:true};
}
const isOver=t=>t.status!=="done"&&t.target&&t.target<todayKey();

/* ================= helpers ================= */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byName=(a,b)=>String(a).localeCompare(String(b),undefined,{sensitivity:"base",numeric:true});
const HUES=[205,160,22,276,340,190,40,250,4,130,300,95];
function color(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return "hsl("+HUES[h%HUES.length]+" 55% 42%)"}
function initials(n){const p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:(p[0][1]||""))).toUpperCase()}
const av=n=>`<span class="av" style="background:${color(n)}" title="${esc(n)}">${esc(initials(n))}</span>`;
function lastUpdate(t){return (t.updates||[]).slice().sort((a,b)=>(b.date+(b.at||"")).localeCompare(a.date+(a.at||"")))[0]||null}
function lastTouch(t){const u=lastUpdate(t);const s=D.seen[t.id];return [u&&u.date,s].filter(Boolean).sort().pop()||t.start||""}
const seenToday=t=>{const tk=todayKey();const u=lastUpdate(t);return D.seen[t.id]===tk||(u&&u.date===tk)};
function staleDays(t){if(t.status==="done")return 0;const l=lastTouch(t);if(!l)return 0;return workBetween(l,todayKey())}
const open=()=>D.tasks.filter(t=>t.status!=="done");
function normName(n){n=String(n||"").trim().replace(/\s+/g," ");if(!n)return "";const hit=D.staff.find(s=>s.toLowerCase()===n.toLowerCase());if(hit)return hit;
  return n.split(" ").map(w=>/^[A-Z]{2,4}$/.test(w)?w:w.length<=2&&w===w.toUpperCase()?w:w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ")}
function ownersOf(t){return t.owners&&t.owners.length?t.owners:["Unassigned"]}

const IC={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>'
};

/* ================= state ================= */
const S={tab:"meet",group:"prio",q:"",focus:null,quick:null,anim:true,edit:null,showDone:"",doneQ:""};
try{const g=localStorage.getItem("minerva-tracker:group");if(g)S.group=g;if(localStorage.getItem("minerva-tracker:present")==="1")document.documentElement.classList.add("present")}catch(e){}
const view=document.getElementById("view");

/* ================= toast + modal ================= */
let tT=null,tUndo=null;
function toast(msg,undo){const t=document.getElementById("toast");tUndo=undo||null;t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="tundo">Undo</button>':""}`;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>{t.hidden=true;tUndo=null},undo?7000:3200)}
document.getElementById("toast").addEventListener("click",e=>{if(e.target.id==="tundo"&&tUndo){const f=tUndo;tUndo=null;document.getElementById("toast").hidden=true;f();save();render();toast("Undone")}});
function modal(html,onClick){const m=document.getElementById("modal");m.innerHTML=`<div class="mbox" role="dialog">${html}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m||e.target.closest("[data-m=close]")){closeModal();return}onClick&&onClick(e)}}
function closeModal(){const m=document.getElementById("modal");m.hidden=true;m.innerHTML=""}
function confirmBox(title,text,okLabel,fn,danger){modal(`<div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><p style="margin:0">${text}</p></div><div class="mf"><button class="btn ghost" data-m="close">Cancel</button><button class="btn ${danger?"danger":""}" data-m="ok">${esc(okLabel)}</button></div>`,e=>{if(e.target.closest("[data-m=ok]")){closeModal();fn()}})}

/* ================= task actions ================= */
const find=id=>D.tasks.find(t=>t.id===id);
function markDone(id){const t=find(id);if(!t||t.status==="done")return;const prev=JSON.parse(JSON.stringify(t));
  const el=view.querySelector(`.row[data-id="${id}"]`);
  const go=()=>{t.status="done";t.doneAt=todayKey();t.doneHow="completed";save();render();toast("“"+t.title+"” moved to Completed",()=>Object.assign(t,prev))};
  if(el&&!matchMedia("(prefers-reduced-motion:reduce)").matches){el.classList.add("leaving");setTimeout(go,260)}else go()}
function markSeen(id){const t=find(id);if(!t)return;const was=D.seen[id];D.seen[id]=todayKey();save();render();
  const el=view.querySelector(`.row[data-id="${id}"]`);el&&el.classList.add("flash");toast("Marked as discussed today",()=>{if(was)D.seen[id]=was;else delete D.seen[id]})}
function cycleStatus(id){const t=find(id);if(!t)return;const order=["ns","on","wait"];const i=order.indexOf(t.status);t.status=order[(i+1)%order.length];save();render()}
function addUpdate(id,text,date){const t=find(id);if(!t||!String(text).trim())return false;t.updates=t.updates||[];t.updates.push({id:uid(),date:date||todayKey(),text:String(text).trim(),at:new Date().toISOString()});
  if(t.status==="ns")t.status="on";save();return true}

/* ================= views ================= */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  const a=document.activeElement,aid=a&&view.contains(a)&&a.id?a.id:null;let s0=null,s1=null;try{if(aid){s0=a.selectionStart;s1=a.selectionEnd}}catch(e){}
  view.innerHTML=S.tab==="meet"?renderMeet():S.tab==="board"?renderBoard():S.tab==="sum"?renderSum():S.tab==="done"?renderDone():renderSet();
  if(S.anim){view.classList.remove("enter");void view.offsetWidth;view.classList.add("enter");S.anim=false;setTimeout(()=>view.classList.remove("enter"),600)}
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});try{if(s0!=null)el.setSelectionRange(s0,s1)}catch(e){}}}
}
function counts(list){const tk=todayKey();return {open:list.length,over:list.filter(isOver).length,today:list.filter(t=>t.target===tk).length,stale:list.filter(t=>staleDays(t)>=2).length,seen:list.filter(seenToday).length}}
function matchQ(t,q){if(!q)return true;q=q.toLowerCase();return [t.title,t.partner,t.endUser,t.country,t.bdm,(t.owners||[]).join(" "),(t.updates||[]).map(u=>u.text).join(" ")].join(" ").toLowerCase().includes(q)}
function sortTasks(a,b){return (a.prio-b.prio)||((isOver(b)?1:0)-(isOver(a)?1:0))||String(a.target||"9999").localeCompare(String(b.target||"9999"))||byName(a.title,b.title)}
function renderMeet(){
  const all=open(), c=counts(all), tk=todayKey();
  const d=new Date();
  let h=`<div class="today"><div><div class="eyebrow">${esc(d.toLocaleDateString("en-GB",{weekday:"long"}))} · Morning meeting</div><h1>${esc(d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}))}</h1></div>
    <div class="kpis">
      <button class="kpi" data-quick="" aria-pressed="${!S.quick}"><b>${c.open}</b><span>Open tasks</span></button>
      <button class="kpi bad" data-quick="over" aria-pressed="${S.quick==="over"}"><b>${c.over}</b><span>Overdue</span></button>
      <button class="kpi warn" data-quick="today" aria-pressed="${S.quick==="today"}"><b>${c.today}</b><span>Due today</span></button>
      <button class="kpi warn" data-quick="stale" aria-pressed="${S.quick==="stale"}"><b>${c.stale}</b><span>No update 2+ days</span></button>
      <button class="kpi ok" data-quick="todo" aria-pressed="${S.quick==="todo"}"><b>${c.open-c.seen}</b><span>Still to discuss</span></button>
    </div></div>`;
  if(!D.tasks.length)return h+`<div class="empty"><h2>No tasks yet</h2><p>Import your current Excel sheet to bring everything across, or add the first task.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="goimport">${IC.up}Import the Excel sheet</button><button class="btn ghost" data-act="new">${IC.plus}New task</button></div></div>`;
  const pct=c.open?Math.round(c.seen/c.open*100):0;
  h+=`<div class="meet"><span class="mtxt">Discussed today: ${c.seen} of ${c.open}<small>Add an update or tap ${IC.eye.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} to tick a task off</small></span><span class="mbar"><i style="width:${pct}%"></i></span><b>${pct}%</b></div>`;
  // people stepper
  const staffOpen={};all.forEach(t=>ownersOf(t).forEach(o=>{(staffOpen[o]=staffOpen[o]||{n:0,o:0}).n++;if(isOver(t))staffOpen[o].o++}));
  const ppl=Object.keys(staffOpen).sort(byName);
  h+=`<div class="tools"><label class="search">${IC.search}<input class="inp" id="q" type="search" placeholder="Search tasks, partners, updates" value="${esc(S.q)}" autocomplete="off"></label>
    <span class="eyebrow" style="margin-left:4px">Group by</span>
    <div class="seg">${[["prio","Priority"],["person","Person"],["partner","Partner"],["status","Status"]].map(([k,l])=>`<button data-group="${k}" aria-pressed="${S.group===k}">${l}</button>`).join("")}</div></div>`;
  h+=`<div class="people" role="group" aria-label="Go through one person at a time"><button class="chip all" data-focus="" aria-pressed="${!S.focus}">Everyone</button>${ppl.map(p=>`<button class="chip" data-focus="${esc(p)}" aria-pressed="${S.focus===p}">${av(p)}${esc(p)}<span class="n${staffOpen[p].o?" bad":""}">${staffOpen[p].n}</span></button>`).join("")}</div>`;
  let list=all.filter(t=>matchQ(t,S.q));
  if(S.focus)list=list.filter(t=>ownersOf(t).includes(S.focus));
  if(S.quick==="over")list=list.filter(isOver);else if(S.quick==="today")list=list.filter(t=>t.target===tk);else if(S.quick==="stale")list=list.filter(t=>staleDays(t)>=2);else if(S.quick==="todo")list=list.filter(t=>!seenToday(t));
  if(S.focus){const mine=all.filter(t=>ownersOf(t).includes(S.focus)),ov=mine.filter(isOver).length,i=ppl.indexOf(S.focus);
    h+=`<div class="focushead">${av(S.focus)}<div style="flex:1"><h2>${esc(S.focus)}</h2><p>${mine.length} open · ${ov} overdue · ${mine.filter(seenToday).length} discussed today</p></div>
      <button class="btn ghost sm" data-act="fprev" ${i<=0?"disabled":""}>‹ ${i>0?esc(ppl[i-1]):""}</button><button class="btn sm" data-act="fnext" ${i<0||i>=ppl.length-1?"disabled":""}>${i<ppl.length-1?esc(ppl[i+1]):""} ›</button></div>`}
  if(!list.length)return h+`<div class="empty"><h2>Nothing here</h2><p>${S.q?"No task matches your search.":S.quick?"No tasks in this view.":"No open tasks."}</p></div>`;
  // groups
  let groups=[];
  if(S.group==="prio")groups=[1,2,3,4].map(p=>({k:"p"+p,t:PRIO[p].l,sub:PRIO[p].s,dot:`var(--p${p})`,items:list.filter(t=>t.prio===p)}));
  else if(S.group==="status")groups=["wait","on","ns"].map(s=>({k:s,t:STATUS[s],items:list.filter(t=>t.status===s)}));
  else if(S.group==="person"){const names=[...new Set(list.flatMap(ownersOf))].sort(byName);groups=names.map(n=>({k:n,t:n,av:n,items:list.filter(t=>ownersOf(t).includes(n))}))}
  else{const names=[...new Set(list.map(t=>t.partner||"No partner"))].sort((a,b)=>(a==="No partner")-(b==="No partner")||byName(a,b));groups=names.map(n=>({k:n,t:n,items:list.filter(t=>(t.partner||"No partner")===n)}))}
  h+=groups.filter(g=>g.items.length).map(g=>`<section class="group"><div class="ghead">${g.dot?`<span class="dot" style="background:${g.dot}"></span>`:""}${g.av?av(g.av):""}<h3>${esc(g.t)}</h3><span class="count">${g.items.length}${g.sub?" · "+esc(g.sub):""}</span></div>
    <div class="list">${g.items.sort(sortTasks).map(row).join("")}</div></section>`).join("");
  return h;
}
function row(t){
  const d=dueInfo(t), u=lastUpdate(t), n=(t.updates||[]).length, st=staleDays(t), seen=seenToday(t);
  const meta=[t.partner&&`<b>${esc(t.partner)}</b>${t.endUser?" → "+esc(t.endUser):""}`,!t.partner&&t.endUser&&`<b>${esc(t.endUser)}</b>`,t.country&&esc(t.country),t.bdm&&"BDM "+esc(t.bdm)].filter(Boolean).join(" · ");
  return `<article class="row p${t.prio}${seen?" seen":""}" data-id="${t.id}" tabindex="0">
    <div><div class="t">${esc(t.title)}</div>${meta?`<div class="meta">${meta}</div>`:""}</div>
    <div class="right">
      ${seen?`<span class="seentag">✓ Discussed</span>`:st>=2?`<span class="stale" title="Last update ${esc(fmt(lastTouch(t)))}">No update ${st} days</span>`:""}

function readDrawer(){const E=S.edit,t=E.t,v=id=>{const x=document.getElementById(id);return x?x.value:null};

  else{const i=D.tasks.findIndex(x=>x.id===t.id);if(E.newU.trim()){t.updates.push({id:uid(),date:E.newUDate||todayKey(),text:E.newU.trim(),at:new Date().toISOString()});if(t.status==="ns")t.status="on";E.newU=""}D.tasks[i]=t;toast("Saved")}

    case "qucancel":S.quickU=null;render();break;
    case "new":openTask(null);break;
    case "goimport":S.tab="set";S.anim=true;render();break;
    case "fprev":case "fnext":{const ppl=[...new Set(open().flatMap(ownersOf))].sort(byName);const i=ppl.indexOf(S.focus);const j=b.dataset.act==="fnext"?i+1:i-1;if(ppl[j]){S.focus=ppl[j];S.anim=true;render();window.scrollTo({top:0,behavior:"smooth"})}break}
    case "reopen":{const t=find(id);if(t){t.status="on";delete t.doneAt;delete t.doneHow;save();render();toast("“"+t.title+"” is back on the list")}break}
    case "xlsx":exportExcel();break;
    case "print":S.tab="meet";render();setTimeout(()=>window.print(),100);break;
    case "backup":backup();break;
    case "snaps":showSnaps();break;
    case "wipe":confirmBox("Delete all tasks?","Every task on this computer will be removed. Download a backup first if you might need them.","Delete everything",()=>{const prev=D;D={...blank(),staff:D.staff};save();render();toast("All tasks deleted",()=>{D=prev})},true);break;
    case "rmstaff":{const n=b.dataset.name;D.staff=D.staff.filter(x=>x!==n);save();render();toast(n+" removed from the team list")}break;
    case "rename":{const n=b.dataset.name;modal(`<div class="mh"><h2>Rename ${esc(n)}</h2></div><div class="mb"><input class="inp" id="rn" value="${esc(n)}" maxlength="40"><p class="hint" style="margin:0">Their tasks are updated too.</p></div><div class="mf"><button class="btn ghost" data-m="close">Cancel</button><button class="btn" data-m="ok">Rename</button></div>`,ev=>{
      if(!ev.target.closest("[data-m=ok]"))return;const nn=document.getElementById("rn").value.trim();if(!nn)return;closeModal();D.staff=D.staff.map(x=>x===n?nn:x);D.tasks.forEach(t=>{t.owners=(t.owners||[]).map(o=>o===n?nn:o);if(t.bdm===n)t.bdm=nn});save();render();toast("Renamed to "+nn)});setTimeout(()=>{const x=document.getElementById("rn");x&&x.select()},30);break}
  }return}
  if(e.target.closest("button,input,a,label,select,textarea"))return;
  const r=e.target.closest(".row[data-id],.card[data-id]");if(r)openTask(r.dataset.id);

function download(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function stamp(){const d=new Date();return key(d)+" "+pad(d.getHours())+"."+pad(d.getMinutes())}
function backup(){D.lastBackup=new Date().toISOString();save();download("Minerva priorities backup "+stamp()+".json",JSON.stringify({app:"minerva-tracker",v:1,saved:D.lastBackup,data:D},null,1),"application/json");toast("Backup downloaded");render()}
function restore(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const d=o&&o.data;if(!d||!Array.isArray(d.tasks))throw 0;
  confirmBox("Restore this backup?",`It has <b>${d.tasks.filter(t=>t.status!=="done").length}</b> open and <b>${d.tasks.filter(t=>t.status==="done").length}</b> finished tasks, saved ${esc(new Date(o.saved||d.created).toLocaleString("en-GB"))}. It replaces what's on this computer now.`,"Restore",()=>{const prev=D;D={...blank(),...d};save();S.tab="meet";S.anim=true;render();toast("Backup restored",()=>{D=prev})})}catch(e){toast("That file isn't a backup from this app.")}};r.readAsText(file)}
function showSnaps(){let s=[];try{s=JSON.parse(localStorage.getItem(SNAP)||"[]")}catch(e){}

    const b=e.target.closest("[data-snap]");if(!b)return;const x=s[+b.dataset.snap];closeModal();const prev=D;D={...blank(),...JSON.parse(JSON.stringify(x.data))};save();render();toast("Restored the list from "+fmt(x.d),()=>{D=prev})})}

function loadScript(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement("script");s.src=src;s.onload=()=>test()?res():rej(new Error("load"));s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function cellDate(v){if(v==null||v==="")return "";if(v instanceof Date&&!isNaN(v))return key(new Date(v.getFullYear(),v.getMonth(),v.getDate()+(v.getHours()>=23?1:0)));
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return key(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return key(new Date(y,+m[2]-1,+m[1]))}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];return ""}
function splitNotes(text,baseKey){
  text=String(text||"").replace(/\s+/g," ").trim();if(!text)return [];
  const re=/(?:^|[;,.]\s*|\s)(\d{1,2})\s?(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?(?:\s+(20\d\d))?\b\s*[-:,]?\s*/gi;
  const marks=[];let m;while((m=re.exec(text))){const day=+m[1];if(day<1||day>31)continue;marks.push({i:m.index,end:re.lastIndex,day,mon:MON[m[2].toLowerCase()],yr:m[3]?+m[3]:null})}
  const base=baseKey?dateOf(baseKey):new Date(), tk=todayKey(), out=[];
  if(!marks.length)return [{date:baseKey||tk,text}];
  if(marks[0].i>0){const pre=text.slice(0,marks[0].i).replace(/[;,.\s]+$/,"").trim();if(pre)out.push({date:baseKey||tk,text:pre})}
  marks.forEach((k,j)=>{let y=k.yr||base.getFullYear();let d=key(new Date(y,k.mon,k.day));if(!k.yr&&d>addWork(tk,5))d=key(new Date(y-1,k.mon,k.day));
    const body=text.slice(k.end,j+1<marks.length?marks[j+1].i:text.length).replace(/^[;,.\s-]+|[;,\s]+$/g,"").trim();if(body)out.push({date:d,text:body})});
  return out}
function splitOwners(s){return String(s||"").split(/\s*(?:\/|,|&|\band\b|\+)\s*/i).map(normName).filter(Boolean)}
function mapStatus(s){s=String(s||"").toLowerCase();if(/complete|done|closed/.test(s))return "done";if(/hold|defer|wait|pending/.test(s))return "wait";if(/progress|ongoing|started(?!.*not)/.test(s)&&!/not started/.test(s))return "on";return "ns"}
function mapPrio(num,txt){const n=parseInt(num,10);if(n>=1&&n<=4)return n;txt=String(txt||"").toLowerCase();if(!txt)return 2;const imp=!/not important/.test(txt),urg=!/not urgent/.test(txt)&&/urgent/.test(txt);return imp&&urg?1:imp?2:urg?3:4}
async function importExcel(file){
  toast("Reading "+file.name+"…");
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",()=>window.XLSX)}catch(e){toast("Couldn't load the Excel reader. Check the internet connection.");return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true})}catch(e){toast("That file couldn't be opened as Excel.");return}
  const found=[];
  const take=(name,forceDone)=>{const ws=wb.Sheets[name];if(!ws)return;const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let hi=rows.findIndex(r=>r.some(c=>/^\s*task\s*$/i.test(String(c))));if(hi<0)return;const H=rows[hi].map(c=>String(c).trim().toLowerCase());
    const col=(re,nth)=>{let k=0;for(let i=0;i<H.length;i++)if(re.test(H[i])){if(k===(nth||0))return i;k++}return -1};
    const C={partner:col(/^partner/),end:col(/^end.?user/),country:col(/^country/),bdm:col(/^bdm/),task:col(/^task$/),p1:col(/^priority/),p2:col(/^priority/,1),resp:col(/^responsib/),status:col(/^status/),start:col(/^start/),target:col(/^(target|due) date/),notes:col(/^notes?$/)};
    rows.slice(hi+1).forEach(r=>{const g=k=>C[k]>=0?r[C[k]]:"";const title=String(g("task")).replace(/\s+/g," ").trim();if(!title)return;
      const start=cellDate(g("start"));let status=forceDone?"done":mapStatus(g("status"));
      const updates=splitNotes(g("notes"),start).map(u=>({id:uid(),date:u.date,text:u.text,at:""}));
      const t={id:uid(),title,partner:String(g("partner")).trim(),endUser:String(g("end")).trim(),country:normCountry(g("country")),bdm:normName(splitOwners(g("bdm"))[0]||""),
        owners:splitOwners(g("resp")),prio:mapPrio(g("p1"),C.p2>=0?g("p2"):g("p1")),status,start,target:cellDate(g("target")),updates,created:new Date().toISOString(),src:name};
      if(status==="done"){t.doneAt=(updates.map(u=>u.date).sort().pop())||t.target||todayKey();t.doneHow=forceDone&&/remove/i.test(String(g("notes")))?"removed":"completed"}
      found.push(t)})};
  const main=wb.SheetNames.find(n=>/^main/i.test(n))||wb.SheetNames.find(n=>{const ws=wb.Sheets[n];return ws&&XLSX.utils.sheet_to_json(ws,{header:1}).slice(0,3).some(r=>r.some(c=>/^\s*task\s*$/i.test(String(c))))});

  const op=found.filter(t=>t.status!=="done"),dn=found.filter(t=>t.status==="done"),movedNow=op.length?found.filter(t=>t.src===main&&t.status==="done").length:0;
  const people=[...new Set(found.flatMap(t=>t.owners))].sort(byName);
  modal(`<div class="mh"><h2>Import ${esc(file.name)}</h2></div><div class="mb">
    <div class="note"><b>${op.length}</b> open tasks${main?` from “${esc(main)}”`:""}, and <b>${dn.length}</b> finished${rem?` (including “${esc(rem)}”)`:""}.${movedNow?` <b>${movedNow}</b> marked Completed on the main sheet will go straight to Completed.`:""}</div>
    <p style="margin:0" class="hint">People found: ${people.map(esc).join(", ")||"none"}</p>
    ${D.tasks.length?`<label style="display:flex;gap:8px;align-items:center"><input type="radio" name="imode" value="replace" checked> Replace the ${D.tasks.length} tasks already here</label><label style="display:flex;gap:8px;align-items:center"><input type="radio" name="imode" value="merge"> Add to them (skip tasks with the same name)</label>`:""}
  </div><div class="mf"><button class="btn ghost" data-m="close">Cancel</button><button class="btn" data-m="ok">${IC.up}Import</button></div>`,e=>{
    if(!e.target.closest("[data-m=ok]"))return;const mode=(document.querySelector('input[name=imode]:checked')||{}).value||"replace";closeModal();
    const prev=JSON.parse(JSON.stringify(D));
    if(mode==="replace")D.tasks=[];
    const have=new Set(D.tasks.map(t=>t.title.toLowerCase()));found.forEach(t=>{if(mode==="merge"&&have.has(t.title.toLowerCase()))return;delete t.src;D.tasks.push(t)});
    found.forEach(t=>t.owners.concat(t.bdm?[t.bdm]:[]).forEach(o=>{if(o&&!D.staff.some(s=>s.toLowerCase()===o.toLowerCase()))D.staff.push(o)}));
    save();S.tab="meet";S.anim=true;render();toast("Imported "+found.length+" tasks",()=>{D=prev})});
}
function normCountry(c){c=String(c||"").trim();if(!c)return "";const m={"uae":"UAE","u.a.e":"UAE","ksa":"Saudi","saudi arabia":"Saudi"};return m[c.toLowerCase()]||c.charAt(0).toUpperCase()+c.slice(1)}

    const due=dueInfo(t);row.getCell(11).value={formula:`IF(H${R}="Completed","Completed",IF(ISBLANK(J${R}),"No target date",IF(J${R}=TODAY(),"Due today",IF(J${R}>TODAY(),"Due in "&(NETWORKDAYS(TODAY(),J${R})-1)&" working days","Overdue by "&(NETWORKDAYS(J${R},TODAY())-1)&" working days"))))`,result:due.l};
    const pf=PF[t.prio];const pc=row.getCell(6);pc.fill=solid(pf[0]);pc.font={size:10,bold:true,color:{argb:pf[1]}};
    const sf=SF[st]||SF["Not Started"];const sc=row.getCell(8);sc.fill=solid(sf[0]);sc.font={size:10,bold:true,color:{argb:sf[1]}};
    const dc=row.getCell(11);dc.font={size:10,bold:true,color:{argb:due.over?"FFB42318":due.c==="today"?"FF8A5A00":INK}};
    row.getCell(8).dataValidation={type:"list",allowBlank:true,formulae:['"Not Started,Ongoing,Waiting,Completed"']};
    row.getCell(6).dataValidation={type:"list",allowBlank:true,formulae:['"Important and Urgent,Important and Not Urgent,Not Important but Urgent,Not Important, Not Urgent"']};
  });
  if(op.length){ws.autoFilter={from:{row:4,column:1},to:{row:4+op.length,column:COLS.length}};
    ws.addConditionalFormatting({ref:`K5:K${4+op.length}`,rules:[{type:"containsText",operator:"containsText",text:"Overdue",priority:1,style:{font:{bold:true,color:{argb:"FFB42318"}},fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFFDE7E4"}}}}]})}
  // Completed
  const CC=[["Completed",13,"center"],["How",11,"center"],["Partner",18],["End-user",16],["Country",10,"center"],["Task",40],["Responsibility",18],["Latest update",60]];
  const wc=wb.addWorksheet("Completed",{views:[{state:"frozen",ySplit:4,showGridLines:false}],pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9}});
  head(wc,"Daily Priorities · Completed and removed",CC.length);tableHeader(wc,4,CC);
  D.tasks.filter(t=>t.status==="done").sort((a,b)=>byName(firstOwner(a),firstOwner(b))||String(b.doneAt||"").localeCompare(String(a.doneAt||""))).forEach((t,i)=>{const row=wc.getRow(5+i),u=lastUpdate(t);
    [t.doneAt?dateOf(t.doneAt):null,t.doneHow==="removed"?"Removed":"Completed",t.partner,t.endUser,t.country,t.title,ownersOf(t).slice().sort(byName).join(" / "),u?fmt(u.date,{day:"2-digit",month:"short"})+" "+u.text:""].forEach((v,j)=>{const c=row.getCell(j+1);c.value=v;c.border=box;c.font={size:10,color:{argb:INK},bold:j===5};c.alignment={vertical:"top",wrapText:j>=5,horizontal:CC[j][2]||"left"};if(i%2)c.fill=solid(ZEBRA);if(j===0)c.numFmt="dd mmm yyyy"})});
  // Summary
  const SC=[["Person",22],["Open",9,"center"],["Overdue",10,"center"],["Important and Urgent",14,"center"],["Important, Not Urgent",14,"center"],["Not Important, Urgent",14,"center"],["Not Important, Not Urgent",14,"center"],["No update 2+ days",12,"center"]];
  const wsS=wb.addWorksheet("Summary",{views:[{showGridLines:false}]});head(wsS,"Daily Priorities · Summary",SC.length);tableHeader(wsS,4,SC);wsS.getRow(4).height=34;
  const all=open(), names=[...new Set(all.flatMap(ownersOf))].sort(byName);
  names.forEach((n,i)=>{const m=all.filter(t=>ownersOf(t).includes(n)),row=wsS.getRow(5+i);[n,m.length,m.filter(isOver).length,...[1,2,3,4].map(p=>m.filter(t=>t.prio===p).length),m.filter(t=>staleDays(t)>=2).length].forEach((v,j)=>{const c=row.getCell(j+1);c.value=v;c.border=box;c.alignment={horizontal:j?"center":"left",vertical:"middle"};c.font={size:10.5,bold:j===0,color:{argb:j===2&&v?"FFB42318":INK}};if(i%2)c.fill=solid(ZEBRA)})});
  const tr=wsS.getRow(5+names.length);["Total tasks",all.length,all.filter(isOver).length,...[1,2,3,4].map(p=>all.filter(t=>t.prio===p).length),all.filter(t=>staleDays(t)>=2).length].forEach((v,j)=>{const c=tr.getCell(j+1);c.value=v;c.font={bold:true,color:{argb:NAVY2}};c.fill=solid("FFE3F6FD");c.alignment={horizontal:j?"center":"left"};c.border={top:{style:"medium",color:{argb:NAVY2}}}});
  const n2=wsS.getCell(7+names.length,1);n2.value="Shared tasks count once for each person responsible, so the person rows can add up to more than the total.";n2.font={size:9,italic:true,color:{argb:MUTED}};
  wb.views=[{activeTab:0}];
  const buf=await wb.xlsx.writeBuffer();document.getElementById("toast").hidden=true;
  download("Minerva Daily Priorities "+stamp()+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  }catch(e){console.error(e);toast("Couldn't build the Excel file. Try again.")}
}

/* ================= start ================= */
window.addEventListener("storage",e=>{if(e.key===KEY){D=load();render()}});
snapshot();
render();
// keep due labels fresh when the day changes
let day=todayKey();setInterval(()=>{if(todayKey()!==day){day=todayKey();snapshot();if(!S.edit)render()}},60000);
window.__D=()=>D;
})();
</script>
